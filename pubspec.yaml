name: bible_simplified
description: "Bible Simplified - Easy to understand Telugu Bible app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Preferences
  shared_preferences: ^2.3.4
  
  # Fonts
  google_fonts: ^6.2.1
  
  # UI / Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  
  # Sharing
  share_plus: ^10.1.4
  
  # Routing
  go_router: ^14.8.1
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
    - assets/bible/
